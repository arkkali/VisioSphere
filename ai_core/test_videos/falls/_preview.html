<!DOCTYPE html>
<meta charset="utf-8">
<title>falls — 0.25x preview</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #14151a; color: #e7e7ea; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #9a9aa4; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .card { background: #1d1e25; border: 1px solid #2c2d36; border-radius: 10px; overflow: hidden; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0; padding: 10px 12px; border-bottom: 1px solid #2c2d36; display: flex; justify-content: space-between; }
  .card h2 span { color: #7f8, ; }
  .meta { color: #9a9aa4; font-weight: 400; }
  video { width: 100%; display: block; background: #000; }
  .row { display: flex; gap: 8px; padding: 8px 12px; align-items: center; flex-wrap: wrap; }
  button { background: #2c2d36; color: #e7e7ea; border: 1px solid #3a3b45; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #3a3b45; }
  button.on { background: #4f6bed; border-color: #4f6bed; }
</style>
<h1>falls / 0.25x slow-motion preview</h1>
<p class="sub">Each card plays the <b>_slow</b> file (33.9s, 120fps). Toggle to compare against the original (8.4s).</p>
<div class="grid" id="grid"></div>
<script>
  const names = ["fall1","fall2","fall3","fall4","fall5","fall6","fall7","fall8"];
  const grid = document.getElementById("grid");
  for (const n of names) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${n}<span class="meta" data-meta>slow · 0.25x</span></h2>
      <video src="${n}_slow.mp4" controls preload="metadata" loop></video>
      <div class="row">
        <button class="on" data-mode="slow">0.25x file</button>
        <button data-mode="orig">original</button>
        <button data-half>play at 0.5 rate</button>
      </div>`;
    const vid = card.querySelector("video");
    const meta = card.querySelector("[data-meta]");
    card.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
      const slow = b.dataset.mode === "slow";
      vid.src = slow ? `${n}_slow.mp4` : `${n}.mp4`;
      meta.textContent = slow ? "slow · 0.25x" : "original · 1x";
      card.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x === b));
    });
    const half = card.querySelector("[data-half]");
    half.onclick = () => {
      vid.playbackRate = vid.playbackRate === 1 ? 0.5 : 1;
      half.classList.toggle("on", vid.playbackRate !== 1);
      half.textContent = vid.playbackRate === 1 ? "play at 0.5 rate" : "back to 1 rate";
    };
    grid.appendChild(card);
  }
</script>
